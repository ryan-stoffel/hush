name: Hush
options:
  bundleIdPrefix: io.github.ryan-stoffel
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEAD_CODE_STRIPPING: YES
packages:
  Hush:
    path: .
targets:
  Hush:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: Hush
        product: HushKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryan-stoffel.hush
        PRODUCT_NAME: Hush
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Hush.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  HushUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Hush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryan-stoffel.hush.UITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Hush
schemes:
  Hush:
    build:
      targets:
        Hush: all
        HushUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HushUITests
    archive:
      config: Release
